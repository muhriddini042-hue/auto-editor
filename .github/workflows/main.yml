name: Sync to Hugging Face hub

on:
  push:
    branches: [main]

  # Har qanday holatda qo'lda ishga tushirish imkoniyati
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Hugging Face-dagi username va space nomini kiriting
          # Masalan: https://huggingface.co/spaces/user123/my-bot
          git push --force https://YOUR_HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/YOUR_HF_USERNAME/YOUR_SPACE_NAME main
